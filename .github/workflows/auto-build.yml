name: Auto Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

concurrency:
  group: auto-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 60

  build:
    needs: wait
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Get version
        id: ver
        run: |
          VER=$(grep 'versionName =' app-mobile/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          SHA=$(git rev-parse --short HEAD)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "apk_name=LomenMobile-dev-v${VER}-${SHA}.apk" >> $GITHUB_OUTPUT

      - name: Restore keystore
        run: |
          echo "${{ secrets.LEMONFILM_JKS_B64 }}" | base64 -d > lemonfilm.jks

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app-mobile:assembleRelease

      - name: Rename APK
        run: |
          APK=$(ls app-mobile/build/outputs/apk/release/*.apk | head -n 1)
          echo "Found: $APK"
          mv "$APK" "app-mobile/build/outputs/apk/release/${{ steps.ver.outputs.apk_name }}"

      - name: Upload to dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Dev v${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.sha }})"
          prerelease: true
          body: |
            自动构建（推送后 60s 防抖）
            - Commit: ${{ github.sha }}
            - Version: ${{ steps.ver.outputs.version }}
          files: app-mobile/build/outputs/apk/release/${{ steps.ver.outputs.apk_name }}
