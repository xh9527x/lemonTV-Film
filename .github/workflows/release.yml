# lemonTV-Film 手机版云端构建（tag 触发）
# 参照 xh9527x/EchoTV 的 release.yml 规范：permissions + softprops 发布到 Release。
#
# 使用方式（Muse 的 GitHub App 没有 workflows 写权限，需在网页上手动添加一次）：
# 1. 在 fork 仓库页面：Add file → Create new file，路径填 .github/workflows/release.yml，
#    把本文件内容粘贴进去，Commit。
# 2. Settings → Secrets and variables → Actions → New repository secret，共 4 个：
#    LOMENTV_JKS_B64   = 本地执行 base64 -w0 lemonfilm.jks 的输出
#    KEYSTORE_PASSWORD = keystore 密码
#    KEY_ALIAS         = keystore 别名
#    KEY_PASSWORD      = key 密码
#    （密码/别名由你自己定，不要写进 workflow 明文。）
# 3. 打 tag 并推送，例如：git tag mobile-v1.0.9 && git push origin mobile-v1.0.9
#    （或在网页 Releases → Draft a new release 建 tag；tag 命名沿用作者的 mobile-v* 前缀）
# 4. Actions 跑完后，手机版 release APK 会自动挂到该 tag 的 Release 下。
#
# 说明：原作者仓库无 CI（23 个 release 均为本地手打），此文件为二改新增。
# 本版只构建手机端（app-mobile）。如需 TV 端，加一个 :app:assembleRelease 步骤即可。
# 基线验证建议：先打一个测试 tag（如 mobile-v1.0.9-test）看流水线是否跑通。

name: Build Mobile APK

on:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write  # 允许创建 release 和上传文件

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # 注意：不要加 android-actions/setup-android——GitHub 的 ubuntu runner 自带完整 Android SDK
      #（EchoTV 的 release.yml 也是这么做的，实测可用）；setup-android@v3 在公网 runner 上不稳定。
      # sdkmanager 不在 PATH 里，用 $ANDROID_SDK_ROOT（runner 预置）写全路径。
      - name: Install Android platform 34
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.LOMENTV_JKS_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/lemonfilm.jks"
          # 签名信息走环境变量（与 app-mobile/build.gradle.kts 的 EchoTV 式签名配置对应）；
          # 密码/别名全部来自 secrets，workflow 里不出现明文。
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/lemonfilm.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mobile release APK
        run: ./gradlew :app-mobile:assembleRelease --no-daemon

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-mobile/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
